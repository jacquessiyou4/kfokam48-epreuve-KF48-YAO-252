# Tests : base H2 en mémoire en mode PostgreSQL, aucune base locale nécessaire (B6)
# Une base par contexte Spring : les classes de test qui modifient les données (@DirtiesContext)
# ne polluent pas celles qui lisent les données de démonstration.
spring.datasource.url=jdbc:h2:mem:${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration
