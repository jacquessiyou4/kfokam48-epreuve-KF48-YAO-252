# Tests : base H2 en mémoire en mode PostgreSQL, aucune base locale nécessaire (B6)
spring.datasource.url=jdbc:h2:mem:presence;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration
