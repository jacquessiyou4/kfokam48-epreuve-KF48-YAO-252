spring.application.name=presence

# Base PostgreSQL : valeurs par défaut pour docker compose, surchargées par variables d'environnement
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/presence}
spring.datasource.username=${DB_USER:presence}
spring.datasource.password=${DB_PASSWORD:presence}

# Schéma géré uniquement par Flyway (B5) : Hibernate se contente de vérifier
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration

# Aucune stack trace ni message interne renvoyé au client (B4)
server.error.include-stacktrace=never
server.error.include-message=never
